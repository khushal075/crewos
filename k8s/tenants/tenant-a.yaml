apiVersion: apps/v1
kind: Deployment
metadata:
  name: crewai-worker-tenant-a
  namespace: crewai
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app: crewai-worker
      tenant: tenant_a
  template:
    metadata:
      labels: *id001
    spec:
      terminationGracePeriodSeconds: 300
      containers:
      - name: worker
        image: crewai-crewos:local
        imagePullPolicy: IfNotPresent
        command:
        - worker
        env:
        - name: TENANT_ID
          value: tenant_a
        envFrom:
        - configMapRef:
            name: crewai-config
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
